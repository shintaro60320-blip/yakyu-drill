<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5c39">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>やきゅうドリル</title>
<style>
/* ==== デザイントークン（実況アプリと同じ家の色。屋外でも読める高コントラスト） ==== */
:root {
  --bg: #f4f5f2;
  --surface: #ffffff;
  --ink: #1c2a24;
  --sub: #4c5c54;
  --line: #dde3dd;
  --green: #2e7d4f;
  --green-deep: #1f5c39;
  --green-pale: #e8f2ec;
  --amber: #b45309;
  --amber-pale: #fdf3e3;
  --gold: #ffd75e;
  --s1: 4px; --s2: 8px; --s3: 16px; --s4: 24px;
  --r-card: 14px; --r-btn: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic Medium", Meiryo, sans-serif;
  background: radial-gradient(120% 55% at 50% -12%, #e3efe7 0%, var(--bg) 62%) fixed, var(--bg);
  color: var(--ink); line-height: 1.75;
  max-width: 560px; margin: 0 auto;
  padding-bottom: calc(var(--s4) + env(safe-area-inset-bottom));
}
button { font-family: inherit; font-size: 1rem; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: var(--r-btn); cursor: pointer;
  transition: transform .12s cubic-bezier(.2,.7,.3,1); }
button:active { transform: translateY(1px); }
button[disabled] { opacity: .45; cursor: default; }

.head { background: radial-gradient(150% 130% at 50% -40%, #2a7449 0%, #1a4d30 55%, #0f2e1c 100%);
  color: #fff; padding: 22px var(--s3); display: flex; align-items: center; gap: var(--s2);
  position: relative; overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16), inset 0 -2px 0 rgba(255,215,94,.55), 0 6px 18px rgba(18,55,34,.28); }
.head::before, .head::after { content: ""; position: absolute; top: 50%; border-radius: 14px; pointer-events: none;
  transform: translateY(-50%) rotate(45deg); }
.head::before { right: -72px; width: 200px; height: 200px; border: 1.5px solid rgba(255,255,255,.08); }
.head::after  { right: -30px; width: 124px; height: 124px; border: 1.5px solid rgba(255,215,94,.35);
  box-shadow: 0 0 24px rgba(255,215,94,.18); }
.head h1 { font-size: 1.4rem; letter-spacing: .12em; font-weight: 800; position: relative; color: var(--gold);
  background: linear-gradient(180deg, #fff3c4 0%, var(--gold) 55%, #e6b93b 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: none; filter: drop-shadow(0 1px 0 rgba(0,0,0,.25)); }
.head .back { background: rgba(255,255,255,.14); color: #fff; border: none; border-radius: 999px;
  padding: 8px 16px; font-size: .85rem; }

.wrap { padding: var(--s3); }
.lead { font-size: .95rem; font-weight: 700; letter-spacing: .05em; margin-bottom: var(--s2); }
.note { font-size: .85rem; color: var(--sub); font-variant-numeric: tabular-nums; }

.fieldbox { background: linear-gradient(180deg, #1c5433 0%, #12381f 100%); border: none; border-radius: var(--r-card);
  padding: 10px; margin-bottom: var(--s3);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 2px 4px rgba(18,55,34,.18), 0 12px 28px rgba(18,55,34,.28); }
.field { width: 100%; height: auto; display: block; border-radius: 10px; }
.actor { transition: none; }
.actor.dim { opacity: .72; }
.actor.pick { cursor: pointer; }
/* SVGの中では transform-origin:center が「図全体の中心」になり、輪が斜めにずれて広がっとった（とと 2026-09-03 指摘）。
   transform-box:fill-box で基準点をマーカー自身の中心にする */
.halo { transform-box: fill-box; transform-origin: center; animation: halo 2.6s cubic-bezier(.4,0,.6,1) infinite; }
@keyframes halo { 0% { transform: scale(1); opacity: .5; } 70%, 100% { transform: scale(2.2); opacity: 0; } }

.posname { text-align: center; font-size: 1.05rem; font-weight: 800; margin-bottom: var(--s1); }
.posname .num { display: inline-block; background: var(--gold); color: #3d2c05; border-radius: 999px;
  width: 1.7em; height: 1.7em; line-height: 1.7em; text-align: center; font-weight: 800; margin-right: 6px; }
.bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin: var(--s2) 0; }
.reset { display: block; margin: 0 auto var(--s3); font-size: .95rem; font-weight: 800; letter-spacing: .02em;
  padding: 10px 22px; min-height: 44px; border-radius: 999px; color: var(--green-deep); border-color: #c9d9cf;
  box-shadow: 0 1px 2px rgba(28,42,36,.06); }
.reset[hidden] { display: none; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--green) 0%, #3f9a63 60%, var(--gold) 100%); border-radius: 999px; transition: width .4s cubic-bezier(.2,.7,.3,1); }

.modetabs { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s1); padding: var(--s1);
  background: var(--green-pale); border-radius: 999px; margin-bottom: var(--s3); }
.modetabs .tab { padding: 12px; font-weight: 800; letter-spacing: .04em; border: none; border-radius: 999px;
  background: transparent; color: var(--green-deep);
  transition: background .18s cubic-bezier(.2,.7,.3,1), color .18s cubic-bezier(.2,.7,.3,1); }
.modetabs .tab:active { transform: none; }
.modetabs .tab.on { background: var(--green); color: #fff;
  box-shadow: 0 1px 2px rgba(28,42,36,.12), 0 3px 8px rgba(31,92,57,.24); }
.coach { transition: none; }
.coach.dim { opacity: .72; }
.coach.pick, .runner.pick { cursor: pointer; }
.legend .sw.coach { background: #fff; border: 1.5px solid var(--ink); border-radius: 3px; }
.dec { display: inline-block; background: var(--amber); color: #fff; border-radius: 999px; padding: 2px 12px; font-size: .85rem; font-weight: 800; margin-right: var(--s2); }
.subq { display: flex; gap: var(--s2); flex-wrap: wrap; margin-bottom: var(--s2); font-size: .85rem; font-weight: 700; }
.subq span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; }
.subq span.ok { color: var(--green-deep); border-color: var(--green); }
.subq span.ng { color: #8e2b21; border-color: #8e2b21; }
.subq span.now { background: var(--green); color: #fff; border-color: var(--green-deep); }
.bigbtns { display: grid; gap: var(--s2); }
.bigbtn { padding: var(--s3) 20px; font-size: 1.1rem; font-weight: 800; border-radius: var(--r-card);
  display: flex; align-items: center; gap: var(--s2); min-height: 60px; letter-spacing: .02em;
  box-shadow: 0 1px 2px rgba(28,42,36,.06), 0 4px 12px rgba(28,42,36,.06); }
.bigbtn::after { content: "›"; margin-left: auto; font-size: 1.4rem; opacity: .55; line-height: 1; }
.bigbtn.primary { background: linear-gradient(180deg, #35895a 0%, var(--green) 45%, #276e45 100%); color: #fff; border-color: var(--green-deep);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 1px 2px rgba(28,42,36,.12), 0 6px 16px rgba(31,92,57,.3); }
.bigbtn.primary::after { opacity: .8; }
.bigbtn .sub { font-size: .8rem; font-weight: 400; opacity: .85; }

.list { display: grid; gap: var(--s2); }
.lvl { font-size: .85rem; font-weight: 800; color: var(--green-deep); margin: var(--s3) 0 var(--s1); }
.card { background: var(--surface); border: 1px solid var(--line); border-bottom-width: 2px;
  box-shadow: 0 1px 2px rgba(28,42,36,.05);
  border-radius: var(--r-card); padding: var(--s3); text-align: left; width: 100%;
  display: flex; align-items: center; gap: var(--s2); min-height: 56px; }
.card .t { font-weight: 700; flex: 1; }
.card .chk { background: var(--gold); color: #3d2c05; font-weight: 800; font-size: .78rem; border-radius: 999px; padding: 2px 10px; letter-spacing: .02em; }

.legend { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 12px 4px 2px; font-size: .8rem; color: #dbe8df; font-weight: 700; letter-spacing: .02em; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .sw { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
.legend .sw.mine { background: var(--gold); border: 1.5px solid #3d2c05; }
.legend .sw.def { background: #fff; border: 1.5px solid var(--ink); }
.legend .sw.run { background: #8e2b21; border: 1.5px solid #fff; box-shadow: 0 0 0 1px #8e2b21; }
.legend .sw.ball { background: #fff; border: 1.5px solid #3d2c05; width: 9px; height: 9px; }

.sit { background: linear-gradient(180deg, #1f5c39, #17482c); color: #fff; border-radius: var(--r-btn);
  padding: 10px var(--s3); font-weight: 800; letter-spacing: .04em; margin-bottom: var(--s2);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 0 1px rgba(255,215,94,.22); }
.mycard { background: var(--amber-pale); border: 2px solid #e8c98a; border-radius: var(--r-card);
  padding: var(--s3); margin-bottom: var(--s3); }
.mycard .role { font-size: .8rem; font-weight: 800; color: var(--amber); letter-spacing: .08em; }
.mycard .why { font-size: 1.05rem; font-weight: 700; margin-top: var(--s1); }
.all { display: grid; gap: var(--s1); }
.row { display: flex; gap: var(--s2); align-items: flex-start; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r-btn); padding: var(--s2) 12px; }
.row.me { background: var(--amber-pale); border-color: #e8c98a; }
.row .n { flex: 0 0 1.8em; height: 1.8em; line-height: 1.8em; text-align: center; border-radius: 999px;
  background: var(--green-deep); color: #fff; font-weight: 800; font-size: .8rem; }
.row.me .n { background: var(--amber); }
.row .txt { flex: 1; font-size: .9rem; line-height: 1.6; }
.row .txt b { display: inline-block; margin-right: 6px; }
.row .txt .r { font-size: .75rem; color: var(--sub); }

/* ==== クイズ ==== */
.qhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--s2);
  font-size: .85rem; color: var(--sub); font-weight: 700; font-variant-numeric: tabular-nums; }
.ask { font-size: 1.1rem; font-weight: 800; margin-bottom: var(--s2); }
.ask b { color: var(--amber); }
.ask .hint { display: block; font-size: .82rem; font-weight: 400; color: var(--sub); margin-top: 2px; }
#qField .field { cursor: crosshair; }
.judge { border-radius: var(--r-card); padding: var(--s3); margin-bottom: var(--s3); border: 2px solid; }
.judge.ok { background: var(--green-pale); border-color: var(--green); }
.judge.ng { background: #fdeceb; border-color: #8e2b21; }
.judge .mark { font-size: 1.5rem; font-weight: 800; letter-spacing: .04em; animation: pop .28s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes pop { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.judge.ok .mark { color: var(--green-deep); }
.judge.ng .mark { color: #8e2b21; }
.judge .why { font-weight: 700; margin-top: var(--s1); }
.rcard { background: radial-gradient(120% 120% at 50% -30%, #2a7449 0%, #1a4d30 55%, #0f2e1c 100%); border-radius: var(--r-card);
  padding: var(--s4) var(--s3); margin: var(--s2) 0 var(--s4); text-align: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 12px 28px rgba(18,55,34,.3); }
.rbig { font-size: 3.4rem; font-weight: 800; color: var(--gold); letter-spacing: .02em; line-height: 1.15;
  font-variant-numeric: tabular-nums; text-shadow: 0 0 18px rgba(255,215,94,.35), 0 2px 0 rgba(0,0,0,.25); }
.rcard .note { color: #dbe8df; margin-top: var(--s1); }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px; font-size: .9rem;
  opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 50; }
.toast.on { opacity: .95; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* このアプリについて（ホームの一番下・大人向け）。
   ★子ども向けの本文は小3までの漢字にしとるが、ここだけは大人（保護者・監督）が読む欄なので
     普通の日本語で書く。「ゆうせん」「へんしん」と開くと、かえって読みにくうなる。
     小さく静かな見た目にして、子どもは自然に飛ばす形にした。 */
.about { margin-top: var(--s4); padding-top: var(--s3); border-top: 1px solid var(--line);
  font-size: .78rem; line-height: 1.9; color: var(--sub); }
.about b { color: var(--ink); font-weight: 700; }
.about ul { list-style: none; margin-top: var(--s2); }
.about li { padding-left: 1em; text-indent: -1em; }
.about a { color: var(--green); word-break: break-all; }
</style>
</head>
<body>

<div class="head">

<!-- ===== ホーム: ポジションをえらぶ ===== -->

    <ul>

</div>

<!-- ===== ずかん: 場面リスト ===== -->
<div class="wrap" id="scList" style="display:none">
  <div class="lead" id="listLead"></div>
  <div class="list" id="listBody"></div>
</div>

<!-- ===== ずかん: 再生 ===== -->
<div class="wrap" id="scPlay" style="display:none">
  <div class="sit" id="playSit"></div>
  <div class="fieldbox"><div id="playField"></div><div class="legend" id="legend"></div></div>
  <button class="bigbtn primary" id="btnReplay" style="width:100%;justify-content:center;margin-bottom:16px">▶ もう一度見る</button>
  <div class="mycard" id="myCard"></div>
  <div class="lead">みんなの動き</div>

</div>

<!-- ===== クイズ ===== -->
<div class="wrap" id="scQuiz" style="display:none">
  <div class="qhead"><span id="qCount"></span><span id="qScore"></span></div>
  <div class="sit" id="qSit"></div>
  <div class="ask" id="qAsk"></div>

  <div class="fieldbox"><div id="qField"></div><div class="legend" id="qLegend"></div></div>
  <div id="qActions" style="margin-bottom:16px"></div>
  <div id="qFeedback" style="display:none"></div>
</div>

<!-- ===== クイズ: けっか ===== -->
<div class="wrap" id="scResult" style="display:none">
  <div class="rcard"><div class="rbig" id="rScore"></div><div class="note" id="rDetail"></div></div>
  <div class="bigbtns">
    <button class="bigbtn primary" id="btnQuizAgain">もう一度クイズ</button>
    <button class="bigbtn" id="btnToHome">ホームへもどる</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// field.js — フィールド座標系とSVG描画（純関数・DOM禁止）
//
// 座標系: 0-100 正規化。ホーム(50,85)が下・センター方向が上(yが小さい)。
//   ホームから左右のファウルラインはちょうど45度（dx=±37, dy=-37）。
//   図は少年野球実況アプリ（viewBox 400×400）を 1/4 に縮めて移植した。
//   守備の定位置も同アプリの FIELD_POS を 1/4 換算して継承している。
const F = (() => {
  const HOME = [50, 85];

  const BASES = {
    home:   [50, 85],
    first:  [72.5, 62.5],
    second: [50, 40],
    third:  [27.5, 62.5]
  };

  // 守備の定位置（高学年の一般的な位置取り）
  const POS = {
    P:  [50, 73],
    C:  [50, 83],
    "1B": [67, 64.5],
    "2B": [60, 52],
    "3B": [33, 64.5],
    SS: [40, 52],
    LF: [28, 30.5],
    CF: [50, 21.5],
    RF: [72, 30.5]
  };

  // 打順ではなく守備位置の並び（表示・出題の基準順）
  const POSN = ["P", "C", "1B", "2B", "3B", "SS", "LF", "CF", "RF"];

  const POS_JA = {
    P: "ピッチャー", C: "キャッチャー", "1B": "ファースト", "2B": "セカンド",
    "3B": "サード", SS: "ショート", LF: "レフト", CF: "センター", RF: "ライト"
  };

  // スコアブックの背番号。番号そのものが学習内容なのでマーカーに出す
  const POS_NUM = { P: 1, C: 2, "1B": 3, "2B": 4, "3B": 5, SS: 6, LF: 7, CF: 8, RF: 9 };

  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

  // フェアゾーン判定: ホームからの45度ファウルラインの内側、かつ場内
  const inFair = (x, y) => {
    const dx = x - HOME[0], dy = HOME[1] - y; // dy: ホームから前方向
    return dy > 0 && Math.abs(dx) <= dy && x >= 0 && x <= 100 && y >= 0 && y <= 100;
  };

  // 折れ線のSVG path文字列（動きの経路を描くのに使う）
  const pathD = (pts) => pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ");

  // 打球の軌道の「ふくらみ」（実況アプリの打球図と同じ流儀・400px座標の1/4換算）
  //   fly=大きい山なり / hit=前ヒットのゆるい弧 / liner=低くするどい弧 / grounder=直線
  const BALL_BULGE = { grounder: 0, hit: 7.5, liner: 5.5, fly: 15 };

  // 打球のカーブの制御点。ゴロ（ふくらみ0）は null
  const ballCtrl = (ball, traj) => {
    const bulge = BALL_BULGE[traj] || 0;
    if (!bulge) return null;
    const a = ball[0], b = ball[ball.length - 1];
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
    const side = b[0] >= a[0] ? 1 : -1;   // 右方向の打球は右へ、左方向は左へふくらむ
    return [mx - dy / len * bulge * side, my + dx / len * bulge * side];
  };

  // 打球の軌道のSVG path（ゴロ=直線・それ以外=カーブ）
  const ballPathD = (ball, traj) => {
    const c = ballCtrl(ball, traj);
    if (!c) return pathD(ball);
    const a = ball[0], b = ball[ball.length - 1];
    return "M" + a[0] + " " + a[1] + " Q " + c[0].toFixed(1) + " " + c[1].toFixed(1) + " " + b[0] + " " + b[1];
  };

  // 打球の t(0〜1) 時点の位置（アニメ用。カーブの上を通る）
  const lerpBall = (ball, traj, t) => {
    const c = ballCtrl(ball, traj);
    if (!c) return lerpPath(ball, t);
    if (t <= 0) return ball[0].slice();
    if (t >= 1) return ball[ball.length - 1].slice();
    const a = ball[0], b = ball[ball.length - 1], u = 1 - t;
    return [u * u * a[0] + 2 * u * t * c[0] + t * t * b[0],
            u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]];
  };

  // 折れ線上を t(0〜1) の割合で進んだ地点。アニメの1コマぶんの位置を出す
  const lerpPath = (pts, t) => {
    if (!pts || !pts.length) return null;
    if (pts.length === 1 || t <= 0) return pts[0].slice();
    if (t >= 1) return pts[pts.length - 1].slice();
    const segs = [];
    let total = 0;
    for (let i = 1; i < pts.length; i++) {
      const d = dist(pts[i - 1], pts[i]);
      segs.push(d); total += d;
    }
    if (total === 0) return pts[0].slice();
    let want = total * t;
    for (let i = 0; i < segs.length; i++) {
      if (want <= segs[i] || i === segs.length - 1) {
        const r = segs[i] === 0 ? 0 : want / segs[i];
        const a = pts[i], b = pts[i + 1];
        return [a[0] + (b[0] - a[0]) * r, a[1] + (b[1] - a[1]) * r];
      }
      want -= segs[i];
    }
    return pts[pts.length - 1].slice();
  };

  // 選手マーカー1人ぶん。transformで動かせるよう <g translate> 構造にする
  // o.tap=true で、指でも押せる大きさの透明な当たり判定を重ねる（48px以上の的を作るため）
  const playerSVG = (pos, xy, o) => {
    o = o || {};
    const p = xy || POS[pos];
    const r = o.r || 4.2;
    const cls = "actor" + (o.cls ? " " + o.cls : "");
    return '<g class="' + cls + '" data-pos="' + pos + '" transform="translate(' + p[0] + ' ' + p[1] + ')">'
      + (o.tap ? '<circle r="7.5" fill="transparent"/>' : '')
      + (o.halo ? '<circle class="halo" r="' + r + '" fill="none" stroke="' + (o.stroke || "#1c2a24") + '" stroke-width="1"/>' : '')
      + '<circle r="' + r + '" fill="' + (o.fill || "#ffffff") + '" stroke="' + (o.stroke || "#1c2a24") + '" stroke-width="' + (o.sw || 0.8) + '"/>'
      + '<text y="1.6" text-anchor="middle" font-size="4.6" font-weight="700" fill="' + (o.ink || "#1c2a24") + '">' + POS_NUM[pos] + '</text>'
      + '</g>';
  };

  // せめるモードの役割マーカーの位置（ホーム画面で「自分」を選ぶ場所）
  //   走者は塁の上。バッターはホームのよこ（バッターボックス）。コーチャーは一るい側／三るい側のコーチャーズボックス（ファウル地域）
  //   ★座標は「指の的が重ならんこと」で決めとる: 一番近い R1↔coach1 が 17.7（当たり判定の直径15より大きい）。
  //     前は coach1[82,70] で 12.1 しか離れとらず、一るいランナーを押したのにコーチャーが選ばれる所があった。
  //     B の下端も、ハローが図からはみ出さんように 88 に置いとる（89 だと 100.4 で外へ出る）。
  const ROLE_POS = {
    B: [57, 88], R1: BASES.first, R2: BASES.second, R3: BASES.third,
    coach1: [86, 74], coach3: [14, 74]
  };

  // wait付きの位置計算（せめるモードの走者用）。pts[k] に「着地（捕球）の瞬間」に居る。
  //   t<land: pts[0..k] を進む / t>=land: pts[k..] を進む。k が無ければ lerpPath と同じ。
  //   これが無いと「タッチアップ」が捕球の前に走り出す絵になる（教えたいことと逆）。
  const lerpPathWait = (pts, k, t, land) => {
    if (k === undefined || k === null || !pts || pts.length < 2) return lerpPath(pts, t);
    if (t < land) return lerpPath(pts.slice(0, k + 1), land > 0 ? t / land : 1);
    return lerpPath(pts.slice(k), land < 1 ? (t - land) / (1 - land) : 1);
  };

  // 走者マーカー。守備(白丸・黒ふち)とはっきり区別できるよう、あかい丸に白ふちにする
  //   色の根拠（WCAG検算済み）: 塗り#8e2b21 に白文字=8.34:1。
  //   図形としての見え方は「塗りと白ふちの良い方」で見る＝芝3.63 / 内野ダート3.47 / 場外7.46 で
  //   どの地色の上でも3:1以上（前の#b3362aは内野ダートの上で2.51しか出ず、塁の上で見えにくかった）
  //   o.fill/stroke/ink=せめるモードで「自分」を金色にする / o.tap=指で押せる透明な的 / o.halo=脈打つ輪
  const runnerSVG = (id, xy, o) => {
    o = o || {};
    const label = id === "B" ? "打" : "走";
    const r = o.r || 3.8;
    const fill = o.fill || "#8e2b21", stroke = o.stroke || "#ffffff", ink = o.ink || "#ffffff";
    return '<g class="runner' + (o.cls ? " " + o.cls : "") + '" data-run="' + id + '" transform="translate(' + xy[0] + ' ' + xy[1] + ')">'
      + (o.tap ? '<circle r="7.5" fill="transparent"/>' : '')
      + (o.halo ? '<circle class="halo" r="' + r + '" fill="none" stroke="' + stroke + '" stroke-width="1"/>' : '')
      + '<circle r="' + r + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1"/>'
      + '<text y="1.4" text-anchor="middle" font-size="4" font-weight="700" fill="' + ink + '">' + label + '</text>'
      + '</g>';
  };

  // コーチャーマーカー。走者(丸)と区別できるよう角丸の四角・白地に濃いふち・ラベル「コ」
  //   白地なので場外(暗い芝)の上でも見える（守備の白丸と同じ根拠）。自分のときは金色（o.fill）
  //   脈打つ輪(halo)は白で固定：こげ茶のふちの色だと、暗い場外の上で見えん（とと 2026-09-03「コーチャー自身の輪がなかった」）
  const coachSVG = (id, xy, o) => {
    o = o || {};
    const r = o.r || 3.8;
    const fill = o.fill || "#ffffff", stroke = o.stroke || "#1c2a24", ink = o.ink || "#1c2a24";
    return '<g class="coach' + (o.cls ? " " + o.cls : "") + '" data-role="' + id + '" transform="translate(' + xy[0] + ' ' + xy[1] + ')">'
      + (o.tap ? '<circle r="7.5" fill="transparent"/>' : '')
      + (o.halo ? '<circle class="halo" r="' + r + '" fill="none" stroke="#ffffff" stroke-width="1"/>' : '')
      + '<rect x="' + (-r) + '" y="' + (-r) + '" width="' + (2 * r) + '" height="' + (2 * r) + '" rx="1.2" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + (o.sw || 0.9) + '"/>'
      + '<text y="1.4" text-anchor="middle" font-size="4" font-weight="700" fill="' + ink + '">コ</text>'
      + '</g>';
  };

  // アウトカウントのランプ（グラウンド右上の場外に置く。とと 2026-09-03「右上あたりにアウトカウント」）
  //   走塁の判断はアウトの数で変わるので、文章だけでなく試合のスコアボードと同じ「赤いランプ」で見せる。
  //   点灯＝走者と同じ赤(#8e2b21)+白ふち（場外#2c5f3fの上で白ふちが7.46:1）／消灯＝白のふちだけ。ボール・ストライクは出さん（打った後の判断に関係ない）
  //   ★ランプは2つ（とと 2026-09-03「3アウトはチェンジ。スコアボードも2つ」）。座標は図（0-100）に収まること: 右端＝69+21+1.9=91.9。前は translate(76) で3つ目が x=102 に出て切れ、
  //     2つ目の消灯の輪だけが端に「白い点」として残っとった（とと 2026-09-03 指摘）。テスト A6 で右端を検査する
  const OUTS_X = 69, OUTS_Y = 6, OUTS_R = 1.9, OUTS_CX = [16, 21];
  const outsSVG = (outs) => {
    const n = Math.max(0, Math.min(2, outs | 0));
    let s = '<g class="outs" transform="translate(' + OUTS_X + ' ' + OUTS_Y + ')">'
      + '<text x="0" y="1.5" font-size="3.6" font-weight="700" fill="#ffffff" opacity="0.9">アウト</text>';
    OUTS_CX.forEach((cx, i) => {
      const on = i < n;
      s += '<circle cx="' + cx + '" cy="0" r="' + OUTS_R + '" fill="' + (on ? "#8e2b21" : "rgba(0,0,0,0.28)")
        + '" stroke="#ffffff" stroke-width="' + (on ? 0.8 : 0.6) + '" opacity="' + (on ? 1 : 0.75) + '"/>';
    });
    return s + '</g>';
  };
  // ランプの右端（テスト用。図からはみ出さんことの検査）
  const outsRight = () => OUTS_X + OUTS_CX[OUTS_CX.length - 1] + OUTS_R + 0.4;

  // グラウンド図。uid=1画面に複数置くときのid衝突よけ / inner=図の上に重ねる要素
  const fieldSVG = (uid, inner) => {
    const u = uid || "f";
    let s = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="field">';
    s += '<defs><clipPath id="fair-' + u + '"><path d="M50 85 L10 45 A 56.5 56.5 0 0 1 90 45 Z"/></clipPath></defs>';
    s += '<rect x="0" y="0" width="100" height="100" rx="3" fill="#2c5f3f"/>';        // 場外(暗めの芝)
    s += '<g clip-path="url(#fair-' + u + ')">';
    s += '<rect x="0" y="0" width="100" height="100" fill="#469660"/>';               // フェアゾーン
    for (let r = 10; r <= 50; r += 10)
      s += '<circle cx="50" cy="85" r="' + r + '" fill="none" stroke="#3f8c58" stroke-width="5"/>';  // 芝の刈り込み
    s += '<circle cx="50" cy="85" r="54.5" fill="none" stroke="#b08b5c" stroke-width="4"/>';         // ウォーニングトラック
    s += '</g>';
    s += '<path d="M50 85 L27.5 62.5 A 31.75 31.75 0 0 1 72.5 62.5 Z" fill="#c9a06b"/>';             // 内野ダート
    s += '<path d="M50 79.5 L33 62.5 L50 45.5 L67 62.5 Z" fill="#469660"/>';                         // 内野の芝ダイヤ
    s += '<circle cx="50" cy="73" r="3.25" fill="#b8905c"/>';                                        // マウンド
    s += '<path d="M50 85 L27.5 62.5 L50 40 L72.5 62.5 Z" fill="none" stroke="#f0ede6" stroke-width="0.6"/>'; // ベースパス
    s += '<line x1="50" y1="85" x2="13" y2="48" stroke="#f0ede6" stroke-width="0.4" opacity="0.35"/>';        // ファウルライン(薄く)
    s += '<line x1="50" y1="85" x2="87" y2="48" stroke="#f0ede6" stroke-width="0.4" opacity="0.35"/>';
    const base = (x, y) => '<rect x="' + (x - 1.75) + '" y="' + (y - 1.75) + '" width="3.5" height="3.5" fill="#fff" transform="rotate(45 ' + x + ' ' + y + ')"/>';
    s += base(72.5, 62.5) + base(50, 40) + base(27.5, 62.5);                          // 一・二・三塁=菱形
    s += '<path d="M48 83 h4 v2 l-2 1.75 l-2 -1.75 z" fill="#fff"/>';                 // ホーム=五角形
    if (inner) s += inner;
    s += '</svg>';
    return s;
  };

  return { HOME, BASES, POS, POSN, POS_JA, POS_NUM, ROLE_POS, dist, inFair, pathD, lerpPath, lerpPathWait, ballPathD, lerpBall, playerSVG, runnerSVG, coachSVG, outsSVG, outsRight, fieldSVG };
})();
if (typeof module !== "undefined") module.exports = F;

<script>
// engine.js — 判定・進捗の純ロジック（DOM禁止。test.html でテストされる）
//
// 依存: field.js（F.POS / F.POSN / F.dist）
// ここが「正解の決め方」の唯一の場所。UIは判定を自分で書かない。
const E = (() => {
  const POSN = F.POSN; // 守備位置の並びは field.js の定義を唯一の正とする

  // ==== せめるモード（攻撃側）====
  // 役割の並び（表示・出題の基準順）。B=バッター / R1〜R3=塁のランナー / coach1・coach3=コーチャー
  const ROLEN = ["B", "R1", "R2", "R3", "coach1", "coach3"];
  const ROLE_JA = { B: "バッター", R1: "一るいランナー", R2: "二るいランナー", R3: "三るいランナー", coach1: "一るいコーチャー", coach3: "三るいコーチャー" };
  const RUNNERN = ["B", "R1", "R2", "R3"];
  // 正解発表の札に出す言葉（正誤には使わん＝正誤は場所だけで決める）
  const DECISIONS = ["すすむ", "とまる", "もどる", "ハーフウェイ", "タッチアップ", "かけぬける", "回る"];
  const BASE_OF = { B: F.BASES.home, R1: F.BASES.first, R2: F.BASES.second, R3: F.BASES.third };
  const isCoach = (role) => role === "coach1" || role === "coach3";

  const attackRoles = (sc) => sc.attack ? ROLEN.filter((r) => !!sc.attack[r]) : [];
  const attackScenes = (scs, role) => scs.filter((sc) => attackRoles(sc).indexOf(role) >= 0);
  // その役割が答える走者の並び。走者役＝自分だけ / コーチャー＝見る走者（watchに書いた順）
  const attackQuestions = (sc, role) => isCoach(role) ? sc.attack[role].watch.slice() : [role];
  // 答え＝ ask:"catch"（捕られる瞬間どこ？）なら path[wait] / ask:"dest"（どこまで行く？）なら最後の点
  const runnerAnswer = (sc, rid) => {
    const m = sc.attack[rid];
    return sc.attack.ask === "catch" ? m.path[m.wait] : m.path[m.path.length - 1];
  };
  const judgeRunner = (sc, rid, tap) => {
    const answer = runnerAnswer(sc, rid);
    const d = F.dist(tap, answer);
    const tol = (sc.quiz && sc.quiz.tolerance) || 12;
    return { correct: d <= tol, dist: d, answer: answer };
  };

  // 攻撃データのリント（場面を足した時の壊れを機械で見つける）
  const lintAttack = (sc, at) => {
    const a = sc.attack;
    if (!a || typeof a !== "object") { at("attackがオブジェクトでない"); return; }
    if (["きほん", "おうよう"].indexOf(a.level) < 0) at("attack.levelが無い/変な値（きほん か おうよう）");
    if (["dest", "catch"].indexOf(a.ask) < 0) at("attack.askが無い/変な値（dest=どこまで行く？ / catch=捕られる瞬間どこ？）");
    Object.keys(a).forEach((k) => { if (k !== "level" && k !== "ask" && ROLEN.indexOf(k) < 0) at("attackに知らないキー " + k); });
    if (!a.B) at("attack.B（バッター）が無い");
    const want = ((sc.situation && sc.situation.runners) || []).map((b) => "R" + b);
    want.forEach((r) => { if (!a[r]) at("attack." + r + " が無い（situation.runnersに居る）"); });
    ["R1", "R2", "R3"].forEach((r) => { if (a[r] && want.indexOf(r) < 0) at("attack." + r + " が居るが situation.runners に無い"); });
    RUNNERN.forEach((r) => {
      const m = a[r]; if (!m) return;
      if (!Array.isArray(m.path) || m.path.length < 1) { at("attack." + r + " のpathが1点以上ない"); return; }
      m.path.forEach((pt) => {
        if (!Array.isArray(pt) || pt.length !== 2) at("attack." + r + " の座標の形が変 " + JSON.stringify(pt));
        else if (pt[0] < 0 || pt[0] > 100 || pt[1] < 0 || pt[1] > 100) at("attack." + r + " の座標が場外 " + pt);
      });
      if (Array.isArray(m.path[0]) && m.path[0].length === 2 && F.dist(m.path[0], BASE_OF[r]) > 0.01) at("attack." + r + " の出発点が自分の塁の上でない");
      if (DECISIONS.indexOf(m.decision) < 0) at("attack." + r + " のdecisionが無い/変な値（" + DECISIONS.join("/") + "）");
      if (!m.why) at("attack." + r + " のwhyが無い");
      if (m.wait !== undefined && !(Number.isInteger(m.wait) && m.wait >= 0 && m.wait < m.path.length)) at("attack." + r + " のwaitが範囲外");
      if (a.ask === "catch" && m.wait === undefined) at("attack." + r + " にwaitが無い（catchの場面は走者全員に必須）");
    });
    ["coach1", "coach3"].forEach((c) => {
      const m = a[c]; if (!m) return;
      if (!Array.isArray(m.watch) || m.watch.length < 1 || m.watch.length > 2) at("attack." + c + " のwatchは1〜2人");
      else m.watch.forEach((w) => { if (RUNNERN.indexOf(w) < 0 || !a[w]) at("attack." + c + " のwatch " + w + " はこの場面に居ない"); });
      if (!m.why) at("attack." + c + " のwhyが無い");
    });
  };

  // その場面でそのポジションが「最後に居るべき場所」＝正解
  // path が空＝「そのまま」なので定位置が正解になる
  const answerOf = (sc, pos) => {
    const path = sc.moves[pos].path;
    return path.length ? path[path.length - 1] : F.POS[pos];
  };

  const judge = (sc, pos, tap) => {
    const answer = answerOf(sc, pos);
    const d = F.dist(tap, answer);
    const tol = (sc.quiz && sc.quiz.tolerance) || 12;
    return { correct: d <= tol, dist: d, answer: answer };
  };

  // データリント: シナリオを足した時の壊れを機械で見つける
  const lint = (scs) => {
    const errs = [];
    const seen = {};
    scs.forEach((sc) => {
      const at = (m) => errs.push((sc.id || "(idなし)") + ": " + m);
      if (!sc.id) at("idが無い");
      else if (seen[sc.id]) at("idが重複");
      if (sc.id) seen[sc.id] = true;
      if (!sc.title) at("titleが無い");
      if (["grounder", "hit", "liner", "fly"].indexOf(sc.traj) < 0)
        at("trajが無い/変な値（grounder=ゴロ, hit=前ヒット, liner=ライナー, fly=フライ から選ぶ）");
      if (!Array.isArray(sc.ball) || sc.ball.length < 2) at("ball軌道が短い");
      else if (!sc.foul) {
        // 打球はフェアゾーンに落ちる（ファウルの場面を作るときは foul:true を付ける）
        var land = sc.ball[sc.ball.length - 1];
        if (!F.inFair(land[0], land[1])) at("打球の着地点がファウルゾーン " + land);
      }
      POSN.forEach((p) => {
        const mv = sc.moves && sc.moves[p];
        if (!mv) { at(p + " が無い"); return; }
        if (!mv.why) at(p + " のwhyが無い");
        if (!mv.role) at(p + " のroleが無い");
        if (!Array.isArray(mv.path)) { at(p + " のpathが配列でない"); return; }
        mv.path.forEach((pt) => {
          if (!Array.isArray(pt) || pt.length !== 2) at(p + " の座標の形が変 " + JSON.stringify(pt));
          else if (pt[0] < 0 || pt[0] > 100 || pt[1] < 0 || pt[1] > 100) at(p + " の座標が場外 " + pt);
        });
      });
      // 走者（任意。あれば形と座標を検査する）
      if (sc.runs !== undefined) {
        if (!Array.isArray(sc.runs)) { at("走者(runs)が配列でない"); return; }
        sc.runs.forEach((r) => {
          if (!r || !r.id) { at("走者にidが無い"); return; }
          if (!Array.isArray(r.path) || r.path.length < 2) { at("走者 " + r.id + " のpathが2点未満（どこからどこへ走るか要る）"); return; }
          r.path.forEach((pt) => {
            if (!Array.isArray(pt) || pt.length !== 2) at("走者 " + r.id + " の座標の形が変 " + JSON.stringify(pt));
            else if (pt[0] < 0 || pt[0] > 100 || pt[1] < 0 || pt[1] > 100) at("走者 " + r.id + " の座標が場外 " + pt);
          });
        });
      }
      if (sc.attack !== undefined) lintAttack(sc, at);
    });
    return errs;
  };

  // 出題: 未クリアを優先して n 件（全部クリア済みなら全体から）
  const pickQuiz = (scs, pos, clearedIds, n, rand) => {
    const r = rand || Math.random;
    const shuffle = (arr) => arr
      .map((v) => [r(), v])
      .sort((a, b) => a[0] - b[0])
      .map((x) => x[1]);
    const fresh = shuffle(scs.filter((s) => clearedIds.indexOf(s.id) < 0));
    const done  = shuffle(scs.filter((s) => clearedIds.indexOf(s.id) >= 0));
    return fresh.concat(done).slice(0, n);
  };

  const newProgress = () => {
    const cleared = {};
    POSN.concat(ROLEN).forEach((p) => { cleared[p] = []; });
    return { cleared: cleared, total: { asked: 0, correct: 0 } };
  };

  // 進捗の更新は必ずここを通す（UIが直接いじらない）
  const applyResult = (prog, pos, id, correct) => {
    const p = JSON.parse(JSON.stringify(prog));
    if (!p.cleared[pos]) p.cleared[pos] = [];
    p.total.asked++;
    if (correct) {
      p.total.correct++;
      if (p.cleared[pos].indexOf(id) < 0) p.cleared[pos].push(id);
    }
    return p;
  };

  // その役目/ポジションの正解記録だけ消す（とと 2026-09-03「最初からやり直したい時のリセットボタン」）。
  // 合計(total)はアプリ全体の数なので触らん
  const resetRole = (prog, role) => {
    const p = JSON.parse(JSON.stringify(prog));
    p.cleared[role] = [];
    return p;
  };

  // 保存データが壊れていても落ちないよう、形を整えて返す
  const normalizeProgress = (raw) => {
    const base = newProgress();
    if (!raw || typeof raw !== "object") return base;

<script>
// ==== 状態 ====
var KEY = "yakyu_drill_v1";
var App = { mode: "defense", pos: null, arole: null, screen: "home", sc: null, progress: E.newProgress() };
function isAttack() { return App.mode === "attack"; }
function meRole() { return isAttack() ? App.arole : App.pos; }       // いま選んどる「自分」
function meName() { return isAttack() ? E.ROLE_JA[App.arole] : F.POS_NUM[App.pos] + " " + F.POS_JA[App.pos]; }
function myScenes() { return isAttack() ? E.attackScenes(SCENARIOS, App.arole) : SCENARIOS; }

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return;
    var d = JSON.parse(raw);
    if (d && typeof d.pos === "string" && F.POS[d.pos]) App.pos = d.pos;
    if (d && (d.mode === "attack" || d.mode === "defense")) App.mode = d.mode;
    if (d && typeof d.arole === "string" && E.ROLEN.indexOf(d.arole) >= 0) App.arole = d.arole;
    App.progress = E.normalizeProgress(d && d.progress);
  } catch (e) { /* 壊れていても既定のまま動かす */ }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ pos: App.pos, mode: App.mode, arole: App.arole, progress: App.progress })); }
  catch (e) { toast("記ろくがほぞんできませんでした"); }
}
var toastTimer = null;
function toast(msg) {
  var el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove("on"); }, 2400);
}
function $(id) { return document.getElementById(id); }

// ==== 表示のことば ====
function sitText(sc, withOuts) {
  var r = sc.situation.runners;
  var run = r.length ? "ランナー " + r.map(function (x) { return x + "るい"; }).join("・") : "ランナーなし";
  // ずかんはグラウンド右上のランプ（F.outsSVG）だけ。クイズは判断に効くので言葉でも出す（withOuts）
  var o = sc.situation.outs;
  return run + "・" + sc.situation.play + (withOuts ? "・" + (o === 0 ? "ノーアウト" : o + "アウト") : "");
}

// ==== ホーム画面 ====
var GOLD = { fill: "#ffd75e", stroke: "#3d2c05", ink: "#3d2c05" };
function roleSVG(role, xy, o) { return E.isCoach(role) ? F.coachSVG(role, xy, o) : F.runnerSVG(role, xy, o); }
function renderHome() {
  $("tabDefense").classList.toggle("on", !isAttack());
  $("tabAttack").classList.toggle("on", isAttack());
  $("homeLead").textContent = isAttack() ? "自分の役目をえらぼう" : "自分のポジションをえらぼう";
  var inner = "";
  if (isAttack()) {
    E.ROLEN.forEach(function (r) {
      var mine = r === App.arole;
      inner += roleSVG(r, F.ROLE_POS[r], mine
        ? { r: 5.2, fill: GOLD.fill, stroke: GOLD.stroke, ink: GOLD.ink, cls: "pick", tap: true, halo: true }
        : { cls: "pick dim", tap: true });
    });
  } else {
    F.POSN.forEach(function (p) {
      var mine = p === App.pos;
      inner += F.playerSVG(p, null, mine
        ? { r: 5.2, fill: "#ffd75e", stroke: "#3d2c05", sw: 1.1, ink: "#3d2c05", cls: "pick", tap: true, halo: true }
        : { r: 4.2, fill: "#ffffff", stroke: "#1c2a24", sw: 0.8, cls: "pick dim", tap: true });
    });
  }
  $("homeField").innerHTML = F.fieldSVG("home", inner);

  var me = meRole();
  if (me) {
    $("posName").innerHTML = isAttack() ? E.ROLE_JA[me]
      : '<span class="num">' + F.POS_NUM[me] + "</span>" + F.POS_JA[me];
    var done = App.progress.cleared[me].length;
    var all = myScenes().length;
    $("posBar").style.width = (all ? Math.round(done / all * 100) : 0) + "%";
    $("posProg").textContent = "クイズ正かい " + done + " / " + all + " 場面";
    $("btnReset").hidden = done === 0;
  } else {
    $("btnReset").hidden = true;
    $("posName").textContent = isAttack() ? "▲ グラウンドの人をタップ" : "▲ グラウンドのせんしゅをタップ";
    $("posBar").style.width = "0%";
    $("posProg").textContent = "";
  }
  $("btnZukan").disabled = !me;
  $("btnQuiz").disabled = !me;
}
document.getElementById("homeField").addEventListener("click", function (ev) {
  var g = ev.target.closest ? ev.target.closest(".actor, .runner, .coach") : null;
  if (!g) return;
  if (isAttack()) App.arole = g.getAttribute("data-run") || g.getAttribute("data-role");
  else App.pos = g.getAttribute("data-pos");
  save(); renderHome();
});
// 正解の記録をその役目だけ消す（クイズは未クリアの場面から出るので、全部クリアせんと最初からやり直せんかった）
$("btnReset").onclick = function () {
  var me = meRole(); if (!me) return;
  if (!confirm(meName() + " の正かいの記ろくを消して、さいしょからちょうせんする？")) return;
  App.progress = E.resetRole(App.progress, me);
  save(); renderHome(); toast("さいしょからちょうせん！");
};
$("tabDefense").onclick = function () { App.mode = "defense"; save(); renderHome(); };
$("tabAttack").onclick = function () { App.mode = "attack"; save(); renderHome(); };

// ==== ずかん: 一覧 ====
function renderList() {
  $("listLead").innerHTML = '<span class="num" style="background:#ffd75e;color:#3d2c05;border-radius:999px;padding:2px 10px;font-weight:800">'
    + meName() + "</span> で見る場面";
  var me = meRole();
  var lv = {}, order = [];
  myScenes().forEach(function (sc) {
    var name = isAttack() ? sc.attack.level : sc.level;
    if (!lv[name]) { lv[name] = []; order.push(name); }
    lv[name].push(sc);
  });
  order.sort(function (a, b) { return (a === "きほん" ? 0 : 1) - (b === "きほん" ? 0 : 1); });
  var html = "";
  order.forEach(function (name) {
    html += '<div class="lvl">' + name + "</div>";
    lv[name].forEach(function (sc) {
      var cleared = App.progress.cleared[me].indexOf(sc.id) >= 0;
      html += '<button class="card" data-id="' + sc.id + '"><span class="t">' + sc.title + "</span>"
        + (cleared ? '<span class="chk">✓ せいかい</span>' : "") + '<span aria-hidden="true">›</span></button>';
    });
  });
  $("listBody").innerHTML = html;
}
document.getElementById("listBody").addEventListener("click", function (ev) {
  var b = ev.target.closest ? ev.target.closest(".card") : null;
  if (!b) return;
  var id = b.getAttribute("data-id");
  App.sc = SCENARIOS.filter(function (s) { return s.id === id; })[0];
  go("play");
});

// ==== グラウンド図の組み立て（ずかん・クイズで共通） ====
// opt.trails: 動きの線を出す（★クイズの出題中は答えになるので出さない）
// opt.ballAtEnd: ボールを着地点に置く（出題中は「どんな打球か」を見せる必要がある）
// opt.tap: こたえた場所に印を出す / opt.focus: ハローを付ける走者id（コーチャーの問いで「この人のこと」を示す）
// opt.selfHalo: 自分のマーカーにホームと同じ脈打つ輪を付ける（クイズの出題中。とと 2026-09-03「選んだ時とクイズで整合性を」）
// せめるモード: 走者は attack のpathで描く（runsは守備モード専用）。自分は金色。コーチャーはボックスに立つ
function fieldInner(sc, my, opt) {
  opt = opt || {};
  var inner = "";
  var atk = isAttack();
  if (opt.trails && !atk) {
    F.POSN.forEach(function (p) {
      var mv = sc.moves[p];
      if (mv.path.length > 1) {
        var mine = p === my;
        inner += '<path d="' + F.pathD(mv.path) + '" fill="none" stroke="' + (mine ? "#ffd75e" : "#ffffff")
          + '" stroke-width="' + (mine ? 1.2 : 0.6) + '" stroke-dasharray="2 1.6" opacity="' + (mine ? 0.95 : 0.35) + '"/>';
      }
    });
  }
  // ボールの線（どんな打球かは出題中も見せる）
  // 実況アプリの打球図と同じ描き分け: ゴロ=直線の実線 / フライ・ヒット・ライナー=ふくらんだ点線
  var ballDash = sc.traj === "grounder" ? "" : ' stroke-dasharray="1.4 1.6"';
  inner += '<path d="' + F.ballPathD(sc.ball, sc.traj) + '" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="'
    + (opt.trails ? 0.45 : 0.7) + '"' + ballDash + '/>';
  if (opt.trails) {
    if (atk) {
      // 走者の線（自分だけ金色）— せめるモードは attack のpathが正しい走り方
      E.RUNNERN.forEach(function (r) {
        var m = sc.attack[r];
        if (!m || m.path.length < 2) return;
        var mine = r === my;
        inner += '<path d="' + F.pathD(m.path) + '" fill="none" stroke="' + (mine ? "#ffd75e" : "#8e2b21")
          + '" stroke-width="' + (mine ? 1.3 : 0.9) + '" stroke-dasharray="2.4 1.8" opacity="' + (mine ? 0.95 : 0.7) + '"/>';
      });
    } else {
      // 走者の線（あかい点線）— なぜ守備がそう動くのかは、走者を見れば分かる
      (sc.runs || []).forEach(function (r) {
        inner += '<path d="' + F.pathD(r.path) + '" fill="none" stroke="#8e2b21" stroke-width="0.9" stroke-dasharray="2.4 1.8" opacity="0.8"/>';
      });
    }
  }
  // 守備（せめるモードでは全員うすく）
  F.POSN.forEach(function (p) {
    var mv = sc.moves[p];
    var start = mv.path.length ? mv.path[0] : F.POS[p];
    inner += (!atk && p === my)
      ? F.playerSVG(p, start, { r: 5.2, fill: "#ffd75e", stroke: "#3d2c05", sw: 1.1, ink: "#3d2c05", halo: !!opt.selfHalo })
      : F.playerSVG(p, start, { r: 4, fill: "#ffffff", stroke: "#1c2a24", sw: 0.7, cls: "dim" });
  });
  // 走者（守備の上に描く。かさなっても見えるように）
  if (atk) {
    E.RUNNERN.forEach(function (r) {
      var m = sc.attack[r]; if (!m) return;
      var o = (r === my) ? { r: 4.6, fill: GOLD.fill, stroke: GOLD.stroke, ink: GOLD.ink, halo: !!opt.selfHalo } : {};
      if (opt.focus === r) o.halo = true;
      inner += F.runnerSVG(r, m.path[0], o);
    });
    ["coach1", "coach3"].forEach(function (c) {
      if (!sc.attack[c]) return;
      inner += F.coachSVG(c, F.ROLE_POS[c], c === my ? { r: 4.6, fill: GOLD.fill, stroke: GOLD.stroke, ink: GOLD.ink, halo: !!opt.selfHalo } : {});
    });
  } else {
    (sc.runs || []).forEach(function (r) { inner += F.runnerSVG(r.id, r.path[0]); });
  }
  // 正解の場所の印（金の◎）。「金色の人が動いた先」と言うても、動かん正解やコーチャー（赤い走者が動く）では伝わらんかった（とと 2026-09-03）
  (opt.answers || []).forEach(function (a) {
    inner += '<g class="ansmark"><circle cx="' + a[0] + '" cy="' + a[1] + '" r="5.4" fill="none" stroke="#ffffff" stroke-width="2.6"/>'
      + '<circle cx="' + a[0] + '" cy="' + a[1] + '" r="5.4" fill="none" stroke="#ffd75e" stroke-width="1.5"/>'
      + '<circle cx="' + a[0] + '" cy="' + a[1] + '" r="1.3" fill="#ffd75e" stroke="#3d2c05" stroke-width="0.5"/></g>';
  });
  // こたえた場所の印（白いふちで、どんな背景でも見える）
  if (opt.tap) {
    inner += '<g class="tapmark"><circle cx="' + opt.tap[0] + '" cy="' + opt.tap[1] + '" r="3.6" fill="none" stroke="#ffffff" stroke-width="2.2"/>'
      + '<circle cx="' + opt.tap[0] + '" cy="' + opt.tap[1] + '" r="3.6" fill="none" stroke="#1c2a24" stroke-width="1.1"/></g>';
  }
  // アウトカウントのランプ（右上の場外。走塁の判断はアウトで変わるので、いつも見える所に）
  inner += F.outsSVG(sc.situation.outs);
  var b = opt.ballAtEnd ? sc.ball[sc.ball.length - 1] : sc.ball[0];
  inner += '<circle class="ball" cx="' + b[0] + '" cy="' + b[1] + '" r="1.9" fill="#ffffff" stroke="#3d2c05" stroke-width="0.7"/>';
  return inner;
}
var LEGEND = '<span><i class="sw mine"></i>自分</span><span><i class="sw def"></i>守り</span>'
  + '<span><i class="sw run"></i>ランナー</span><span><i class="sw ball"></i>ボール</span>';
var ALEGEND = '<span><i class="sw mine"></i>自分</span><span><i class="sw run"></i>ランナー</span>'
  + '<span><i class="sw coach"></i>コーチャー</span><span><i class="sw def"></i>守り</span><span><i class="sw ball"></i>ボール</span>';
function legend() { return isAttack() ? ALEGEND : LEGEND; }

// ==== ずかん: 再生 ====
var animRAF = null;
function renderPlay() {
  var sc = App.sc, my = meRole();
  $("playSit").textContent = sitText(sc);
  $("playField").innerHTML = F.fieldSVG("play", fieldInner(sc, my, { trails: true }));
  $("legend").innerHTML = legend();

  var rows = "";
  if (isAttack()) {
    var a = sc.attack[my];
    $("myCard").innerHTML = '<div class="role">' + E.ROLE_JA[my] + " の役目</div>"
      + '<div class="why">' + (a.decision ? '<span class="dec">' + a.decision + "</span>" : "") + a.why + "</div>";
    E.attackRoles(sc).forEach(function (r) {
      var m = sc.attack[r];
      rows += '<div class="row' + (r === my ? " me" : "") + '"><div class="n">' + (E.isCoach(r) ? "コ" : (r === "B" ? "打" : "走")) + "</div>"
        + '<div class="txt"><b>' + E.ROLE_JA[r] + '</b><span class="r">' + (m.decision || "こえをかける") + "</span><br>" + m.why + "</div></div>";
    });
  } else {
    var mv = sc.moves[my];
    $("myCard").innerHTML = '<div class="role">' + F.POS_JA[my] + " の役目 ／ " + mv.role + "</div>"
      + '<div class="why">' + mv.why + "</div>";
    F.POSN.forEach(function (p) {
      var m = sc.moves[p];
      rows += '<div class="row' + (p === my ? " me" : "") + '"><div class="n">' + F.POS_NUM[p] + "</div>"
        + '<div class="txt"><b>' + F.POS_JA[p] + '</b><span class="r">' + m.role + "</span><br>" + m.why + "</div></div>";
    });
  }
  $("allRows").innerHTML = rows;

  animate("playField", sc, my);
}
function animate(hostId, sc, my) {
  if (animRAF) cancelAnimationFrame(animRAF);
  var host = $(hostId);
  var atk = isAttack();
  var actors = {};
  F.POSN.forEach(function (p) { actors[p] = host.querySelector('.actor[data-pos="' + p + '"]'); });
  var runners = {};
  // せめるモードは attack のpath（正しい走り方）で動かす。まもるモードは runs（守備が備える相手の動き）
  var runList = atk
    ? E.RUNNERN.filter(function (r) { return sc.attack[r]; }).map(function (r) { return { id: r, path: sc.attack[r].path, wait: sc.attack[r].wait }; })
    : (sc.runs || []);
  runList.forEach(function (r) { runners[r.id] = host.querySelector('.runner[data-run="' + r.id + '"]'); });
  var ball = host.querySelector(".ball");
  // ボールが先・人が追う。フライは滞空が長い（着地までの時間で描き分ける）
  var land = sc.traj === "fly" ? 0.7 : sc.traj === "grounder" ? 0.4 : 0.5;
  var setAt = function (t) {
    F.POSN.forEach(function (p) {
      var mv = sc.moves[p];
      var pt = mv.path.length ? F.lerpPath(mv.path, t) : F.POS[p];
      actors[p].setAttribute("transform", "translate(" + pt[0] + " " + pt[1] + ")");
    });
    runList.forEach(function (r) {
      // wait付き＝「捕ってから走る」（タッチアップ・ハーフウェイ）。着地の瞬間に pts[wait] に居る
      var pt = atk ? F.lerpPathWait(r.path, r.wait, t, land) : F.lerpPath(r.path, t);
      if (runners[r.id]) runners[r.id].setAttribute("transform", "translate(" + pt[0] + " " + pt[1] + ")");
    });
    var bp = F.lerpBall(sc.ball, sc.traj, Math.min(1, t / land));
    ball.setAttribute("cx", bp[0]); ball.setAttribute("cy", bp[1]);
  };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { setAt(1); return; }
  var DUR = 2600, t0 = null;
  setAt(0);
  animRAF = requestAnimationFrame(function step(now) {
    if (t0 === null) t0 = now;
    var t = Math.min(1, (now - t0) / DUR);
    var e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // なめらかに
    setAt(e);
    if (t < 1) animRAF = requestAnimationFrame(step);
  });
}
$("btnReplay").onclick = function () { animate("playField", App.sc, meRole()); };

// ==== クイズ ====
function startQuiz() {
  var me = meRole();
  var list = E.pickQuiz(myScenes(), me, App.progress.cleared[me], 10, Math.random);
  App.quiz = { list: list, i: 0, correct: 0, tap: null, answered: false, qs: [], qi: 0, marks: [] };
  go("quiz");
}
// 問いの言葉。せめるモードは ask で2種類（dest=どこまで行く？ / catch=捕られる瞬間どこ？）
function askText(sc, me, rid, step, total) {
  var catchQ = isAttack() && sc.attack.ask === "catch";
  var head = total > 1 ? '<span class="dec">' + (step + 1) + "人目</span>" : "";
  var more = (total > 1 && step === 0) ? "（このあと、もう1人聞くよ）" : "";
  var hint = catchQ ? "もどるなら今いるるい・様子を見るなら、るいとるいの間をタップ" : "止まるなら、今いるるいをタップ";
  if (!isAttack())
    return "きみは <b>" + F.POS_NUM[me] + " " + F.POS_JA[me] + "</b>。どこへ動く？"
      + '<span class="hint">グラウンドをタップしてね（動かないと思ったら、今の場所をタップ）</span>';
  if (E.isCoach(me))
    return head + "きみは <b>" + E.ROLE_JA[me] + "</b>。<b>" + E.ROLE_JA[rid] + "</b> は"
      + (catchQ ? "、ボールが取られるしゅんかん、どこにいるのが正かい？" : "どこまで行かせる？")
      + '<span class="hint">' + hint + more + "</span>";
  return "きみは <b>" + E.ROLE_JA[me] + "</b>。"
    + (catchQ ? "フライが上がった！ボールが取られるしゅんかん、どこにいる？" : "ボールが飛んだ！どこまで行く？")
    + '<span class="hint">' + hint + "</span>";
}
function renderQuiz() {
  var q = App.quiz, sc = q.list[q.i], me = meRole();
  q.tap = null; q.answered = false;
  q.qs = isAttack() ? E.attackQuestions(sc, me) : [me];
  q.qi = 0; q.marks = [];
  $("qCount").textContent = "クイズ " + (q.i + 1) + " / " + q.list.length;
  $("qScore").textContent = "正かい " + q.correct;
  $("qSit").textContent = sitText(sc, true);
  renderQuestion();
  $("qActions").innerHTML = '<button class="bigbtn primary" id="btnConfirm" style="width:100%;justify-content:center" disabled>ここ！</button>';
  $("btnConfirm").onclick = confirmAnswer;
  $("qFeedback").style.display = "none";
  $("qFeedback").innerHTML = "";
}
// コーチャーは走者を続けて聞くので、どこまで答えたかを小さく出す
function subqHTML() {
  var q = App.quiz;
  if (q.qs.length <= 1) return "";
  return q.qs.map(function (r, i) {
    var m = q.marks[i];
    var cls = m === undefined ? (i === q.qi && !q.answered ? "now" : "") : (m ? "ok" : "ng");
    return '<span class="' + cls + '">' + (i + 1) + "人目 " + E.ROLE_JA[r] + (m === undefined ? "" : (m ? " ◯" : " ✕")) + "</span>";
  }).join("");
}
// 1問の中の「いま聞いとる走者」を描く
function renderQuestion() {
  var q = App.quiz, sc = q.list[q.i], me = meRole();
  var rid = q.qs[q.qi];
  $("qAsk").innerHTML = askText(sc, me, rid, q.qi, q.qs.length);
  // コーチャーの問いでは、いま聞いとる走者にハローを付けて「この人のこと」と分かるようにする
  var focus = (isAttack() && E.isCoach(me)) ? rid : null;
  $("qField").innerHTML = F.fieldSVG("quiz", fieldInner(sc, me, { ballAtEnd: true, tap: q.tap, focus: focus, selfHalo: true }));
  $("qLegend").innerHTML = legend();
  $("qSub").innerHTML = subqHTML();
}
// グラウンドのタップ位置を 0-100 の座標にする
document.getElementById("qField").addEventListener("click", function (ev) {
  var q = App.quiz;
  if (!q || q.answered) return;
  var svg = this.querySelector("svg");
  if (!svg) return;
  var r = svg.getBoundingClientRect();
  if (!r.width || !r.height) return;
  q.tap = [
    Math.round((ev.clientX - r.left) / r.width * 1000) / 10,
    Math.round((ev.clientY - r.top) / r.height * 1000) / 10
  ];
  renderQuestion();
  $("btnConfirm").disabled = false;
});
function confirmAnswer() {
  var q = App.quiz, sc = q.list[q.i], me = meRole();
  if (!q.tap || q.answered) return;
  var res = isAttack() ? E.judgeRunner(sc, q.qs[q.qi], q.tap) : E.judge(sc, me, q.tap);
  q.marks.push(res.correct);
  // コーチャーで、まだ聞く走者が残っとる → 次の走者へ（答えはまだ見せん）
  if (q.qi < q.qs.length - 1) {
    q.qi++; q.tap = null;
    renderQuestion();
    $("btnConfirm").disabled = true;
    return;
  }
  q.answered = true;
  var allOk = q.marks.every(function (m) { return m; });
  if (allOk) q.correct++;
  App.progress = E.applyResult(App.progress, me, sc.id, allOk);
  save(); // 1問ごとに保存（とちゅうで止めても消えない）

  $("qScore").textContent = "正かい " + q.correct;
  var answers = isAttack() ? q.qs.map(function (rid) { return E.runnerAnswer(sc, rid); }) : [E.answerOf(sc, me)];
  $("qField").innerHTML = F.fieldSVG("quiz", fieldInner(sc, me, { trails: true, tap: q.tap, answers: answers }));
  animate("qField", sc, me); // 正解の動きをアニメで見せる（自分のタップ印と正解の◎は残したまま）
  $("qSub").innerHTML = subqHTML();
  var last = q.i >= q.list.length - 1;
  var explain;
  if (isAttack()) {
    var a = sc.attack[me];
    explain = (a.decision ? '<span class="dec">' + a.decision + "</span>" : "") + a.why;
  } else {
    var mv = sc.moves[me];
    explain = mv.role + "：" + mv.why;
  }
  $("qFeedback").style.display = "";
  $("qFeedback").innerHTML =
    '<div class="judge ' + (allOk ? "ok" : "ng") + '">'
    + '<div class="mark">' + (allOk ? "◯ 正かい！" : "✕ ちがったよ") + "</div>"
    + '<div class="why">' + explain + "</div>"
    + (allOk ? "" : '<div class="note" style="margin-top:6px">'
        + (isAttack() && E.isCoach(me) ? "金の ◎ が正かいの場所だよ（赤い走者がそこへ動くよ）"
           : isAttack() ? "金の ◎ が正かいの場所だよ（動かないのが正かいの時もあるよ）"
           : "金の ◎ が正かいの場所だよ（動かないのが正かいの時もあるよ）") + "</div>")
    + "</div>";
  $("qActions").innerHTML = '<button class="bigbtn primary" id="btnNext" style="width:100%;justify-content:center">'
    + (last ? "けっかを見る" : "次へ") + "</button>";
  $("btnNext").onclick = function () {
    if (last) { go("result"); } else { q.i++; renderQuiz(); }
  };
}
function renderResult() {
  var q = App.quiz, me = meRole();
  $("rScore").textContent = q.correct + " / " + q.list.length + " 正かい";
  var done = App.progress.cleared[me].length;
  $("rDetail").textContent = (isAttack() ? E.ROLE_JA[me] : F.POS_JA[me]) + "で正かいした場面：" + done + " / " + myScenes().length;
}
$("btnQuizAgain").onclick = startQuiz;
$("btnToHome").onclick = function () { go("home"); };

// ==== 画面きりかえ ====
function go(screen) {
  App.screen = screen;
  if (animRAF) { cancelAnimationFrame(animRAF); animRAF = null; }
  $("scHome").style.display = screen === "home" ? "" : "none";
  $("scList").style.display = screen === "list" ? "" : "none";
  $("scPlay").style.display = screen === "play" ? "" : "none";
  $("scQuiz").style.display = screen === "quiz" ? "" : "none";
  $("scResult").style.display = screen === "result" ? "" : "none";
  $("btnBack").style.display = screen === "home" ? "none" : "";
  $("title").textContent = screen === "home" ? "やきゅうドリル"
    : screen === "list" ? "ずかん"
    : screen === "quiz" ? "クイズ"
    : screen === "result" ? "けっか" : App.sc.title;
  if (screen === "home") renderHome();
  if (screen === "list") renderList();
  if (screen === "play") renderPlay();
  if (screen === "quiz") renderQuiz();
  if (screen === "result") renderResult();
  window.scrollTo(0, 0);
}
$("btnBack").onclick = function () { go(App.screen === "play" ? "list" : "home"); };
$("btnZukan").onclick = function () { if (meRole()) go("list"); };
$("btnQuiz").onclick = function () { if (meRole()) startQuiz(); };

// ==== 起動 ====
load();
go("home");

// オフライン対応（https で配ったときだけ。ファイルを直接ひらいた時は登録しない）
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("./sw.js").catch(function () { /* 失敗してもアプリは動く */ });
}
</script>
